[package]
name = "omvcs-model"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }
